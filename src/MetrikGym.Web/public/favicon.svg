<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#141E2E"/>
      <stop offset="100%" stop-color="#080C14"/>
    </radialGradient>
    
    <!-- Neon Emerald Gradient -->
    <linearGradient id="neonEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Cyan Accent Gradient -->
    <linearGradient id="neonCyan" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <!-- Outer Ring Gradient -->
    <linearGradient id="ringGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="128" fill="url(#bgGlow)"/>

  <!-- Border Glowing Hex / Ring -->
  <rect x="20" y="20" width="472" height="472" rx="112" fill="none" stroke="url(#ringGlow)" stroke-width="6" opacity="0.4"/>

  <!-- Iconic Gym Dumbbell Graphic -->
  <g transform="translate(256,256) rotate(-45) translate(-256,-256)" filter="url(#glowFilter)">
    <!-- Central Bar -->
    <rect x="130" y="240" width="252" height="32" rx="16" fill="url(#neonCyan)"/>
    <!-- Center Grip Knurling lines -->
    <line x1="230" y1="240" x2="230" y2="272" stroke="#080C14" stroke-width="4" stroke-linecap="round"/>
    <line x1="256" y1="240" x2="256" y2="272" stroke="#080C14" stroke-width="4" stroke-linecap="round"/>
    <line x1="282" y1="240" x2="282" y2="272" stroke="#080C14" stroke-width="4" stroke-linecap="round"/>

    <!-- Left Inner Collar -->
    <rect x="170" y="220" width="16" height="72" rx="8" fill="#10B981"/>
    <!-- Left Main Plate (Outer) -->
    <rect x="130" y="160" width="34" height="192" rx="16" fill="url(#neonEmerald)"/>
    <!-- Left Small End Plate -->
    <rect x="96" y="196" width="28" height="120" rx="14" fill="url(#neonEmerald)"/>

    <!-- Right Inner Collar -->
    <rect x="326" y="220" width="16" height="72" rx="8" fill="#10B981"/>
    <!-- Right Main Plate (Outer) -->
    <rect x="348" y="160" width="34" height="192" rx="16" fill="url(#neonEmerald)"/>
    <!-- Right Small End Plate -->
    <rect x="388" y="196" width="28" height="120" rx="14" fill="url(#neonEmerald)"/>
  </g>
</svg>